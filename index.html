<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ЦЕХ — тест склада</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eff5e9;color:#17392c;font:16px system-ui}header{background:#123f31;color:white;padding:24px;font-size:28px;font-weight:800}main{max-width:720px;margin:auto;padding:18px}button,input,select{font:inherit;padding:10px;border:1px solid #bdcec0;border-radius:10px;background:white;color:inherit;min-height:46px}button{cursor:pointer}article,.category,form{display:block;width:100%;background:white;border-radius:14px;padding:15px;margin:10px 0;border:1px solid #ceded1}.category{text-align:left;border-left:6px solid #36a989}.stocks{display:grid;gap:8px}.stock{background:#edf5ed;padding:8px;border-radius:10px;display:flex;align-items:center;justify-content:space-between;gap:10px}.stock button{min-width:46px}label,input{display:block}input{width:100%;margin:5px 0 12px}.save-stock{width:100%;background:#146347;color:white;border-color:#146347;font-weight:700}button:disabled{opacity:.4}@media(min-width:580px){.stocks{grid-template-columns:1fr 1fr}}
html[data-layout="portrait"] main{max-width:480px}
html[data-layout="portrait"] .stocks{grid-template-columns:minmax(0,1fr)}
html[data-layout="landscape"] main{max-width:1000px}
html[data-layout="landscape"] .stocks{grid-template-columns:repeat(2,minmax(0,1fr))}
html[data-layout="landscape"] .stock{flex-wrap:wrap}
html[data-layout="landscape"] .stock>div{white-space:nowrap}
.layout{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:16px}
</style>
<header>🦜 ЦЕХ 🌿</header><main><div class="layout"><label for="layout">Вид экрана</label><select id="layout"><option value="auto">По размеру экрана</option><option value="portrait">Вертикальный</option><option value="landscape">Планшет горизонтально</option></select></div><label for="profile">Тестовый профиль</label><select id="profile"><option>Кондитер 1</option><option>Кондитер 2</option><option>Кондитер 3</option><option>Кондитер 4</option><option>Администратор</option></select> <button id="log" hidden>Журнал</button><section id="screen"></section><p id="status" role="status"></p><small>Демо · данные этого браузера</small></main>
<script>
const $ = id => document.getElementById(id);
const screen = $('screen'), profile = $('profile'), status = $('status');
$('layout').onchange=event=>{
  document.documentElement.dataset.layout=event.target.value;
};
const key = 'ceh-stock-demo';
let data = {categories:[{name:'Муссы',items:[{name:'Сердечко',stock:[10,5]},{name:'Мусс-бомбочка',stock:[17,4]}]}, ...['Бисквиты','Крошка','Капы','Нарезка','Корпусные'].map(name=>({name,items:[]}))], history:[]};
try { const saved=localStorage.getItem(key); if(saved) data=JSON.parse(saved); } catch {}
let category=null;
const draft=new Map();
function discardDraft(){
  if(draft.size && !window.confirm('Выйти без сохранения изменений?')) return false;
  draft.clear();
  return true;
}
function saveDraft(){
  if(admin() || !draft.size) return;
  const updates=[...draft];
  const time=new Date().toLocaleString('ru-RU');
  const operations=[];
  for(const [item,stock] of updates){
    stock.forEach((count,index)=>{
      const delta=count-item.stock[index];
      if(delta) operations.push(time+' · '+profile.value+' · '+item.name+' · Склад '+(index+1)+' · '+(delta>0?'+':'')+delta+' · остаток '+count);
    });
  }
  const next={
    categories:data.categories.map(entry=>entry===category
      ? {...entry,items:entry.items.map(item=>draft.has(item)?{...item,stock:draft.get(item)}:item)}
      : entry),
    history:[...operations,...data.history]
  };
  try {localStorage.setItem(key,JSON.stringify(next));}
  catch {status.textContent='Не удалось сохранить изменения в этом браузере. Черновик сохранён на экране.';return;}
  data=next;
  draft.clear();
  category=null;
  status.textContent='Изменения сохранены';
  render();
}
const admin=()=>profile.selectedIndex===4;
const total=item=>item.stock[0]+item.stock[1];
function add(parent,tag,label,action){
  const node=document.createElement(tag);
  node.textContent=label;
  if(action){node.type='button';node.onclick=action;}
  parent.append(node);
  return node;
}
function record(message){
  data.history.unshift(new Date().toLocaleString('ru-RU')+' · '+profile.value+' · '+message);
  try {localStorage.setItem(key,JSON.stringify(data));} catch {}
  status.textContent=message;
}
function render(){
  screen.replaceChildren();
  $('log').hidden=!admin();
  if(!category){
    add(screen,'h2','Категории');
    for(const entry of data.categories){
      add(screen,'button',entry.name+' · '+entry.items.reduce((sum,item)=>sum+total(item),0)+' шт. ›',()=>{category=entry;status.textContent='';render();}).className='category';
    }
    if(admin())add(screen,'button','＋ Добавить категорию',()=>form(false));
    return;
  }
  add(screen,'button','← Категории',()=>{if(!discardDraft())return;category=null;status.textContent='';render();});
  add(screen,'h2',category.name);
  let saveButton;
  for(const item of category.items){
    const card=add(screen,'article','');
    add(card,'strong',item.name);
    const sum=add(card,'p','Всего '+total(item)+' шт.');
    const stocks=add(card,'div','');
    stocks.className='stocks';
    item.stock.forEach((count,index)=>{
      const row=add(stocks,'div','');row.className='stock';
      const warehouse='Склад '+(index+1);
      add(row,'span',warehouse);
      const controls=add(row,'div','');
      function change(delta){
        const stock=draft.get(item) ?? [...item.stock];
        if(admin()||stock[index]+delta<0)return;
        stock[index]+=delta;
        if(stock.every((value,i)=>value===item.stock[i])) draft.delete(item);
        else draft.set(item,stock);
        balance.textContent=stock[index];
        minus.disabled=stock[index]===0;
        sum.textContent='Всего '+(stock[0]+stock[1])+' шт.';
        saveButton.disabled=!draft.size;
        status.textContent=draft.size?'Есть несохранённые изменения':'';
      }
      const minus=admin()?null:add(controls,'button','−',()=>change(-1));
      const balance=add(controls,'strong',' '+count+' ');
      if(minus){
        minus.disabled=count===0;
        minus.setAttribute('aria-label','Убрать одну штуку: '+item.name+', '+warehouse);
        add(controls,'button','+',()=>change(1)).setAttribute('aria-label','Добавить одну штуку: '+item.name+', '+warehouse);
      }
    });
  }
  if(admin())add(screen,'button','＋ Добавить позицию',()=>form(true));
  else {
    saveButton=add(screen,'button','Сохранить',saveDraft);
    saveButton.className='save-stock';
    saveButton.disabled=!draft.size;
  }
}
function form(isItem){
  screen.replaceChildren();
  const editor=add(screen,'form','');
  add(editor,'h2',isItem?'Добавить позицию':'Добавить категорию');
  function field(label,type){
    const input=add(add(editor,'label',label),'input','');
    input.type=type;input.required=true;
    if(type==='number'){input.min='0';input.max='999999999';input.step='1';input.value='0';}
    else{input.maxLength=80;input.oninput=()=>input.setCustomValidity('');}
    return input;
  }
  const nameField=field('Наименование','text');
  const stocks=isItem?[field('Склад 1','number'),field('Склад 2','number')]:[];
  add(editor,'button','Сохранить');
  add(editor,'button','Отмена',render);
  editor.onsubmit=event=>{
    event.preventDefault();
    const name=nameField.value.trim();
    const list=isItem?category.items:data.categories;
    if(!name||list.some(entry=>entry.name.toLowerCase()===name.toLowerCase())){
      nameField.setCustomValidity(name?'Такое название уже есть':'Введите название');
      nameField.reportValidity();return;
    }
    const stock=stocks.map(input=>input.valueAsNumber);
    list.push(isItem?{name,stock}:{name,items:[]});
    record(isItem?'Добавлена позиция «'+name+'» · склад 1: '+stock[0]+' · склад 2: '+stock[1]:'Добавлена категория «'+name+'»');
    render();
  };
}
let activeProfile=profile.selectedIndex;
profile.onchange=()=>{
  if(!discardDraft()){profile.selectedIndex=activeProfile;return;}
  activeProfile=profile.selectedIndex;
  status.textContent='';
  render();
};
$('log').onclick=()=>{
  screen.replaceChildren();
  add(screen,'button','← К остаткам',render);
  add(screen,'h2','Журнал');
  for(const row of data.history)add(screen,'article',row);
  if(!data.history.length)add(screen,'p','Операций пока нет.');
};
render();
</script></html>
