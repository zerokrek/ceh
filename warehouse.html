<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ЦЕХ — Данилова</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eff5e9;color:#17392c;font:16px system-ui}header{background:#123f31;color:white;padding:24px;font-size:28px;font-weight:800}main{max-width:720px;margin:auto;padding:18px}button,input,select{font:inherit;padding:10px;border:1px solid #bdcec0;border-radius:10px;background:white;color:inherit;min-height:46px}button{cursor:pointer}article,.category,form{display:block;width:100%;background:white;border-radius:14px;padding:15px;margin:10px 0;border:1px solid #ceded1}.category{text-align:left;border-left:6px solid #36a989}.stocks{display:grid;gap:8px}.stock{background:#edf5ed;padding:8px;border-radius:10px;display:flex;align-items:center;justify-content:space-between;gap:10px}.stock button{min-width:46px}label,input{display:block}input{width:100%;margin:5px 0 12px}.save-stock{width:100%;background:#146347;color:white;border-color:#146347;font-weight:700}button:disabled{opacity:.4}@media(min-width:580px){.stocks{grid-template-columns:1fr 1fr}}
html[data-layout="portrait"] main{max-width:480px}
html[data-layout="portrait"] .stocks{grid-template-columns:minmax(0,1fr)}
html[data-layout="landscape"] main{max-width:1000px}
html[data-layout="landscape"] .stocks{grid-template-columns:repeat(2,minmax(0,1fr))}
html[data-layout="landscape"] .stock{flex-wrap:wrap}
html[data-layout="landscape"] .stock>div{white-space:nowrap}
.layout{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:16px}
[hidden]{display:none!important}
.category-row{display:flex;align-items:center;gap:8px}
.category-row .category{flex:1;min-width:0}
.diameter-table{width:100%;border-collapse:collapse;margin-top:12px}
.diameter-table th,.diameter-table td{padding:5px 2px;text-align:center}
.diameter-table tbody tr{border-top:1px solid #dce8dc}
.diameter-controls{display:flex;align-items:center;justify-content:center;gap:3px}
.diameter-controls button{width:36px;padding:2px}
.diameter-controls strong{white-space:nowrap;font-size:.85rem}
.biscuit-card>strong{display:block;text-align:center;margin-bottom:8px}
.diameter-scroll{overflow-x:auto}
.diameter-table{min-width:650px;table-layout:fixed}
.diameter-table th:first-child{width:72px}
.diameter-controls button{width:24px;min-height:34px}
.item-heading{display:flex;align-items:center;gap:8px}
.item-heading>strong{min-width:0;overflow-wrap:anywhere}
.category-row .category{overflow-wrap:anywhere}
.admin-actions{display:flex;flex-shrink:0;align-items:center;gap:8px;margin-left:auto}
@media(max-width:550px){
  .category-row,.item-heading,.admin-actions{gap:4px}
  .admin-actions button{font-size:12px;padding:4px}
  .category-row .category{padding:8px}
}
/* Danilova visual identity */
:root{--forest:#173c28;--forest-dark:#0d291b;--gold:#f5d85b;--paper:#f8f6ed;--ink:#223a2a;--line:#d6dece}
body{background:var(--paper);color:var(--ink);font-family:"Inter",system-ui,sans-serif}
header{background:linear-gradient(120deg,var(--forest-dark),var(--forest));border-bottom:3px solid var(--gold);padding:0}
.brand-bar{max-width:1000px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px}
.brand-bar img{display:block;width:92px;height:auto}
.brand-bar span{font-size:1rem;font-weight:700;letter-spacing:.08em;color:#fff6d7}
article,.category,form{border-color:var(--line);box-shadow:0 2px 8px #1938200a}
.category{border-left-color:#537957;font-weight:650}
.stock{background:#eef2e8}
button,input,select{border-color:#aabca9}
button:not(:disabled):hover{background:#eff3e9}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #4a6b3e;outline-offset:2px}
.save-stock,form button[type="submit"]{background:var(--gold);border-color:#b29831;color:var(--forest-dark);font-weight:750}
.save-stock:not(:disabled):hover,form button[type="submit"]:not(:disabled):hover{background:#ffe780}
.diameter-table tbody tr{border-color:var(--line)}

<script type="module">
const warehouseNames = {1: "Ленина", 2: "Вокзальная"};
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import { supabaseUrl, supabasePublishableKey } from './supabase-config.js';
const client = createClient(supabaseUrl, supabasePublishableKey);
let profile;
const $ = id => document.getElementById(id);
const screen = $('screen'), status = $('status');
$('layout').onchange=event=>{
  document.documentElement.dataset.layout=event.target.value;
};
const nameOrder = new Intl.Collator('ru', { numeric: true });
const compareNames = (left, right) => nameOrder.compare(left.name, right.name);
let data = {categories:[], productNames:new Map()};
let category=null;
let saving=false;
async function loadStock(){
  const responses = await Promise.all([
    client.from('ceh_categories').select('id,name,has_biscuit_diameters').is('archived_at',null).order('id'),
    client.from('ceh_products').select('id,category_id,name,archived_at,biscuit_parent_id,biscuit_diameter,ceh_stock(warehouse_id,quantity)').order('id')
  ]);
  for(const response of responses) if(response.error) throw response.error;
  data.productNames = new Map(responses[1].data.map(product=>[product.id,product.name]));
  data.categories = responses[0].data.sort(compareNames).map(entry=>({...entry, items:responses[1].data
    .filter(product=>product.category_id===entry.id && !product.archived_at)
    .sort(compareNames)
    .map(product=>({...product,stock:[1,2].map(id=>product.ceh_stock.find(row=>row.warehouse_id===id)?.quantity ?? 0)}))}));
}
const draft=new Map();
function discardDraft(){
  if(draft.size && !window.confirm('Выйти без сохранения изменений?')) return false;
  draft.clear();
  return true;
}
async function saveDraft(){
  if(!draft.size || saving) return;
  const changes = [...draft].flatMap(([item, stock])=>stock.flatMap((quantity,index)=>
    quantity===item.stock[index] ? [] : [{product_id:item.id,warehouse_id:index+1,expected:item.stock[index],quantity}]));
  saving=true;
  screen.inert=true;
  $('logout').disabled=true;
  try {
    const {error}=await client.rpc('ceh_save_stock',{changes});
    if(error) {
      status.textContent=error.code==='40001'
        ? 'Остатки уже изменились. Выйди из категории и обнови страницу перед повторным вводом.'
        : 'Не удалось сохранить остатки.';
      return;
    }
    for(const [item,stock] of draft) item.stock=stock;
    draft.clear();
    category=null;
    render();
    status.textContent='Изменения сохранены';
  } catch {
    status.textContent='Связь с сервером прервалась. Проверь остатки перед повторным вводом.';
  } finally {
    saving=false;
    screen.inert=false;
    $('logout').disabled=false;
  }
}
const admin=()=>profile?.role==='admin';
const staffWarehouses=new Map([
  ['konditer1',1], ['konditer2',1],
  ['konditer3',2], ['konditer4',2]
]);
const canEditWarehouse=id=>admin() || staffWarehouses.get(profile?.login)===id;
const total=item=>item.stock[0]+item.stock[1];

function categoryTotal(entry){
  const totalsByParent=new Map();
  for(const item of entry.items){
    if(item.biscuit_parent_id===null) continue;
    const parentId=item.biscuit_parent_id;
    totalsByParent.set(parentId,(totalsByParent.get(parentId) ?? 0)+total(item));
  }
  return entry.items.reduce((sum,item)=>item.biscuit_parent_id===null
    ? sum+(totalsByParent.get(item.id) ?? total(item))
    : sum,0);
}
function add(parent,tag,label,action){
  const node=document.createElement(tag);
  node.textContent=label;
  if(action){node.type='button';node.onclick=action;}
  parent.append(node);
  return node;
}
function render(){
  screen.replaceChildren();
  $('log').hidden=!admin();
  if(!category){
    add(screen,'h2','Категории');
    for(const entry of data.categories){
      const row=add(screen,'div','');
      row.className='category-row';
      add(row,'button',entry.name+' · '+categoryTotal(entry)+' шт. ›',()=>{category=entry;status.textContent='';render();}).className='category';
      if(admin()){
        const actions=add(row,'div','');
        actions.className='admin-actions';
        add(actions,'button','Переименовать',()=>renameEntry(entry,null))
          .setAttribute('aria-label','Переименовать категорию: '+entry.name);
        add(actions,'button','Удалить',()=>archiveEntry(entry,null))
          .setAttribute('aria-label','Удалить категорию: '+entry.name);
      }
    }
    if(admin()) add(screen,'button','＋ Добавить категорию',()=>catalogForm(null));
    return;
  }
  add(screen,'button','← Категории',()=>{if(!discardDraft())return;category=null;status.textContent='';render();});
  add(screen,'h2',category.name);
  let saveButton;
  for(const item of category.items.filter(product=>product.biscuit_parent_id===null)){
    const card=add(screen,'article','');
    const heading=add(card,'div','');
    heading.className='item-heading';
    add(heading,'strong',item.name);
    if(admin()){
      const actions=add(heading,'div','');
      actions.className='admin-actions';
      add(actions,'button','Переименовать',()=>renameEntry(category,item));
      add(actions,'button','Удалить позицию',()=>archiveEntry(category,item));
    }
    const variants=category.items.filter(product=>product.biscuit_parent_id===item.id)
      .sort((left,right)=>left.biscuit_diameter-right.biscuit_diameter);
    if(!variants.length) renderStock(card,item);
    if(variants.length){
      card.classList.add('biscuit-card');
      renderDiameters(card,variants);
    }
  }

  function renderDiameters(card,variants){
    const scroller=add(card,'div','');
    scroller.className='diameter-scroll';
    scroller.tabIndex=0;
    scroller.setAttribute('aria-label','Остатки по диаметрам');
    const table=add(scroller,'table','');
    table.className='diameter-table';
    const heading=add(add(table,'thead',''),'tr','');
    add(heading,'th','Склад').scope='col';
    for(const variant of variants) add(heading,'th',variant.biscuit_diameter).scope='col';
    const body=add(table,'tbody','');
    for(const index of [0,1]){
      const row=add(body,'tr','');
      add(row,'th',warehouseNames[index+1]).scope='row';
      for(const variant of variants){
        const controls=add(add(row,'td',''),'div','');
        controls.className='diameter-controls';
        renderControls(controls,variant,index,null,true);
      }
    }
  }

  function renderStock(card,item){
    const sum=add(card,'p','Всего '+total(item)+' шт.');
    const stocks=add(card,'div','');
    stocks.className='stocks';
    item.stock.forEach((_,index)=>{
      const row=add(stocks,'div','');
      row.className='stock';
      add(row,'span',warehouseNames[index+1]);
      renderControls(add(row,'div',''),item,index,sum,false);
    });
  }

  function renderControls(controls,item,index,sum,compact){
    const count=item.stock[index];
    if(!canEditWarehouse(index+1)){
      const balance=add(controls,'strong',String(count));
      balance.title='Только просмотр';
      return;
    }
    const warehouse=warehouseNames[index+1];
    const balanceLabel=value=>compact ? String(value) : ' '+value+' ';
    function change(delta){
      const stock=draft.get(item) ?? [...item.stock];
      if(stock[index]+delta<0 || stock[index]+delta>2147483647)return;
      stock[index]+=delta;
      if(stock.every((value,i)=>value===item.stock[i])) draft.delete(item);
      else draft.set(item,stock);
      balance.textContent=balanceLabel(stock[index]);
      minus.disabled=stock[index]===0;
      if(sum) sum.textContent='Всего '+(stock[0]+stock[1])+' шт.';
      saveButton.disabled=!draft.size;
      status.textContent=draft.size?'Есть несохранённые изменения':'';
    }
    const minus=add(controls,'button','−',()=>change(-1));
    const balance=add(controls,'strong',balanceLabel(count));
    const plus=add(controls,'button','+',()=>change(1));
    minus.disabled=count===0;
    minus.setAttribute('aria-label','Убрать одну штуку: '+item.name+', '+warehouse);
    plus.setAttribute('aria-label','Добавить одну штуку: '+item.name+', '+warehouse);
    if(compact) controls.prepend(plus);
  }
  if(admin()) add(screen,'button','＋ Добавить позицию',()=>{if(discardDraft()) catalogForm(category.id);});
  {
    saveButton=add(screen,'button','Сохранить',saveDraft);
    saveButton.className='save-stock';
    saveButton.disabled=!draft.size;
  }
}
async function renameEntry(entry,item){
  const original=item?.name ?? entry.name;
  const name=window.prompt('Новое название',original)?.trim();
  if(name===undefined || name===original) return;
  if(!name || [...name].length>100){
    status.textContent='Введи название длиной от 1 до 100 символов.';
    return;
  }
  if(!discardDraft()) return;
  const currentId=category?.id;
  screen.inert=true;
  $('logout').disabled=true;
  $('log').disabled=true;
  let renamed=false;
  try {
    const {error}=await client.rpc('ceh_rename_catalog_entry',{
      entry_category:entry.id,entry_product:item?.id ?? null,new_name:name
    });
    if(error) throw error;
    renamed=true;
    await loadStock();
    category=data.categories.find(candidate=>candidate.id===currentId) ?? null;
    status.textContent='Название сохранено.';
  } catch(error){
    status.textContent=renamed?'Название сохранено. Обнови страницу.':
      error.code==='23505'?'Такое название уже есть.':'Не удалось подтвердить переименование.';
  } finally {
    screen.inert=false;
    $('logout').disabled=false;
    $('log').disabled=false;
    render();
  }
}
async function archiveEntry(entry,item){
  const currentId=entry.id;
  const question=item
    ? 'Удалить позицию «'+item.name+'» из списка остатков?'
    : 'Удалить категорию «'+entry.name+'» вместе со всеми её позициями из списка остатков?';
  if(!window.confirm(question) || !discardDraft()) return;
  screen.inert=true;
  $('logout').disabled=true;
  $('log').disabled=true;
  let archived=false;
  try {
    const {error}=await client.rpc('ceh_archive_catalog_entry',{category_id:currentId,product_id:item?.id ?? null});
    if(error) throw error;
    archived=true;
    await loadStock();
    category=data.categories.find(entry=>entry.id===currentId) ?? null;
    status.textContent=item?'Позиция удалена.':'Категория удалена.';
  } catch {
    status.textContent=archived?'Запись удалена. Обнови страницу.':'Не удалось подтвердить удаление. Обнови страницу перед повтором.';
  } finally {
    screen.inert=false;
    $('logout').disabled=false;
    $('log').disabled=false;
    render();
  }
}
function catalogForm(categoryId){
  screen.replaceChildren();
  const form=add(screen,'form','');
  add(form,'h2',categoryId===null?'Добавить категорию':'Добавить позицию');
  const name=add(add(form,'label','Название'),'input','');
  name.required=true;
  name.maxLength=100;
  const biscuit=categoryId!==null && (category.has_biscuit_diameters || category.name.trim().toLowerCase()==='бисквиты');
  const stocks=categoryId===null || biscuit?[]:[1,2].map(id=>{
    const input=add(add(form,'label',warehouseNames[id]),'input','');
    input.type='number';
    input.required=true;
    input.min='0';
    input.max='2147483647';
    input.step='1';
    input.value='0';
    return input;
  });
  const submit=add(form,'button','Сохранить');
  const cancel=add(form,'button','Отмена',render);
  form.onsubmit=async event=>{
    event.preventDefault();
    submit.disabled=true;
    cancel.disabled=true;
    $('logout').disabled=true;
    $('log').disabled=true;
    let saved=false;
    try {
      const {error}=await client.rpc('ceh_add_catalog_entry',{
        entry_name:name.value.trim(),category:categoryId,quantities:biscuit?[0,0]:stocks.map(input=>input.valueAsNumber)
      });
      if(error){
        status.textContent=error.code==='23505'?'Такое название уже есть.':'Не удалось добавить запись.';
        return;
      }
      saved=true;
      await loadStock();
      category=data.categories.find(entry=>entry.id===categoryId) ?? null;
      render();
      status.textContent='Запись добавлена';
    } catch {
      status.textContent=saved?'Запись добавлена. Обнови страницу, чтобы её увидеть.':'Не удалось подтвердить сохранение. Обнови страницу перед повтором.';
    } finally {
      submit.disabled=saved;
      cancel.disabled=false;
      $('logout').disabled=false;
      $('log').disabled=false;
    }
  };
  status.textContent='';
  name.focus();
}
async function openWorkspace(){
  status.textContent='';
  const {data:{session},error}=await client.auth.getSession();
  if(error || !session) return;
  const result=await client.from('ceh_profiles').select('display_name,role,login').eq('id',session.user.id).maybeSingle();
  $('login').hidden=true;
  $('logout').hidden=false;
  if(result.error || !result.data){
    status.textContent='Для этой учётной записи не настроен профиль «ЦЕХа».';
    return;
  }
  profile=result.data;
  $('account').textContent=profile.display_name;
  await loadStock();
  render();
}
$('login').onsubmit=async event=>{
  event.preventDefault();
  const form=event.currentTarget;
  const button=form.querySelector('button');
  button.disabled=true;
  try {
    const {error}=await client.auth.signInWithPassword({
      email:form.elements.email.value.trim(),password:form.elements.password.value
    });
    form.elements.password.value='';
    if(error){status.textContent='Войти не удалось. Проверь почту и пароль.';return;}
    await openWorkspace();
  } catch {
    status.textContent='Не удалось загрузить склад. Обнови страницу.';
  } finally { button.disabled=false; }
};
$('logout').onclick=async()=>{
  if(!discardDraft())return;
  const {error}=await client.auth.signOut({scope:'local'});
  if(error){status.textContent='Не удалось выйти. Попробуй ещё раз.';return;}
  location.reload();
};
$('log').onclick=async()=>{
  screen.replaceChildren();
  add(screen,'button','← К остаткам',render);
  add(screen,'h2','Журнал');
  try {
    const {data:rows,error}=await client.from('ceh_stock_log')
      .select('created_at,warehouse_id,product_id,user_id,quantity_before,quantity_after')
      .order('id',{ascending:false}).limit(100);
    if(error) throw error;
    if(!rows.length)add(screen,'p','Операций пока нет.');
    for(const row of rows){
      const name=data.productNames.get(row.product_id) ?? row.product_id;
      add(screen,'article',new Date(row.created_at).toLocaleString('ru-RU')+' · '+name+' · '+(warehouseNames[row.warehouse_id] ?? 'Склад '+row.warehouse_id)+' · '+row.quantity_before+' → '+row.quantity_after);
    }
  } catch {status.textContent='Не удалось загрузить журнал.';}
};
openWorkspace().catch(()=>{status.textContent='Не удалось загрузить склад. Обнови страницу.';});
</script></html>
